<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>500 — System Fault | {{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="error-page">
  <div class="error-card">
    <span class="error-code">500</span>
    <i class="fa-solid fa-triangle-exclamation error-icon" aria-hidden="true"></i>
    <h1>System Fault</h1>
    <p>An unexpected error occurred. The incident has been logged for review.</p>
    <a class="btn btn-accent" href="{{ url_for('main.index') }}">
      <i class="fa-solid fa-arrow-left me-2"></i>Return to Home
    </a>
  </div>
</body>
</html>
